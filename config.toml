###############################################################################
# 06.poly5mAll — 6-coin 5m + 15m Up/Down rebound strategy (strategy 1)
#
# 12 configured markets = 6 coins x two timeframes.  Only the six 5m
# markets are enabled by default: the 15m backtest was not good enough.
# 15m is opt-in (src/config.py INTERVAL_DEFAULT_ENABLED); enable one market
# on /config, or add a sub-table like:
#   [ASSETS.ETH.15M]
#   ENABLED = true
# Entry/TP/SL parameters default to the coin-level [ASSETS.<NAME>] values;
# each market can override them in its own sub-table (the 5m tables below).
#
# The [ASSETS.X.5M] sub-tables below carry the latest 5m backtest
# ("absolute minimum drawdown + zero negative months" tier):
#   entry / TP% / SL%
#   ETH  0.06 / 15 / 10     BNB  0.06 / 15 / 10
#   SOL  0.08 / 10 / 0      DOGE 0.06 / 15 / 10
#   XRP  0.06 / 15 / 10     HYPE 0.10 / 10 / 10
# The coin-level values remain the 15m defaults (no new 15m backtest yet).
#
# Strategy timeline:
#   5m  market: 0-60 s   observe + first touch of ENTRY_THRESH -> buy
#   15m market: 0-180 s  observe + first touch of ENTRY_THRESH -> buy
#   from the fill until the window closes:
#       take profit at fill_price * (1 + TP_PCT)
#       price stop   at fill_price * (1 - STOP_LOSS_PCT) when > 0
#   window close: no time-based forced exit.  Any remainder is held to
#                 the Gamma 0/1 settlement.
###############################################################################

[GENERAL]
# Strategy evaluation cadence.  The CLOB WS is event-driven on top of this.
TICK_S = 0.25

[INTERVALS.5M]
WINDOW_SEC = 300
ENTRY_WINDOW_END_S = 60

[INTERVALS.15M]
WINDOW_SEC = 900
# Enter during the first 3 minutes of the 15m window.
ENTRY_WINDOW_END_S = 180

[FEED]
# Price layer adapted from ../02.poly1h:
#   * Gamma /events?slug=... for 5m/15m market discovery
#   * CLOB market WebSocket for best bid/ask + last trade
#   * CLOB /midpoint polled every REST_MIDPOINT_POLL_S as the stable fallback
USE_WS = true
# Independent CLOB WS connections (hash-sharded tokens).  1 = old single
# connection; 7 reduces per-connection subscription load.
WS_SHARDS = 7
# REST /book fallback poll for current tokens, so bid/ask remain usable
# when the WS is down.
BOOK_POLL_S = 3.0
REST_MIDPOINT_POLL_S = 2.0
MARKET_DISCOVERY_S = 2.0
# Start looking for the next window this many seconds before it opens.
PRE_DISCOVERY_LEAD_S = 60.0
# A quote older than this cannot open a position.
STALE_PRICE_MAX_AGE_S = 5.0
# Exits are allowed a longer staleness window; refusing to exit is worse
# than exiting on a slightly old quote.
EXIT_STALE_PRICE_MAX_AGE_S = 15.0
REQUEST_TIMEOUT_S = 5.0

[EXECUTION]
# Paper is the safe default.  Live requires PAPER_TRADING=false AND
# LIVE_ENABLED=true, plus credentials in .env.
PAPER_TRADING = true
LIVE_ENABLED = false

# Fixed stake per trade.  The doc's backtest used 10 U; live default is 2 U.
STAKE_USD = 2.0

# Official Polymarket taker fee:
#   fee = shares * rate * p * (1 - p)
# Current crypto schedule: BTC = 0.05, every other asset = 0.01.
# This value is the default for assets without their own TAKER_FEE_RATE
# (see [ASSETS.BTC] below); makers pay 0.  Keep INCLUDE_FEES=true for
# realistic paper PnL.
TAKER_FEE_RATE = 0.01
INCLUDE_FEES = true

# Take-profit execution:
#   observed = trigger on executable bid >= target, FAK sell at target floor;
#              the fill is the best bid (captures a gap above target).
#   market   = trigger on observed mid >= target, marketable FAK below the
#              bid (doc's option B); can fill below target.
TP_EXECUTION_MODE = "observed"

# Per-market price stop as a fraction below the actual fill price, armed
# from the fill (same time as TP).  0 = off.  Set per coin in
# [ASSETS.<NAME>] STOP_LOSS_PCT or per market on /config.
STOP_LOSS_PCT = 0.0

# Entry liquidity gate: require both sides of the book and at least this
# much bid notional (USDC), so the position can be exited later.
REQUIRE_TWO_SIDED_BOOK = true
MIN_ENTRY_BID_DEPTH_USD = 5.0

# Max concurrent open positions with the same side across all markets.
MAX_SAME_SIDE_POSITIONS = 6
# Global concurrent exposure across BOTH timeframes, both sides and all
# markets.  Open positions plus in-flight entries count; positions waiting
# for settlement still count.  0 disables each cap.  These are the aggregate
# guards on top of the per-window caps below.  Editable on /config.
MAX_OPEN_POSITIONS = 6
MAX_OPEN_NOTIONAL_USD = 10.0
# Max same-side entries inside one market window, across all markets on
# that timeframe.  Crypto markets are highly correlated: several UP entries
# in one window are effectively one leveraged bet.  The 5m and 15m windows
# are counted separately.  Positions from earlier windows awaiting
# settlement do not count.  0 disables the cap.
MAX_SAME_SIDE_PER_WINDOW = 2

# Retry cadence when a FAK order returns no fill.
ENTRY_RETRY_S = 1.0
EXIT_RETRY_S = 1.0
# Marketable SELL limit as a fraction below the current bid (2% = 2.0).
SLIPPAGE_PCT = 2.0

# Optional microstructure filter: skip an entry when the absolute spread
# (ask - bid) exceeds this price.  0.01 = 1 cent; 0 disables the filter.
# When enabled, a missing/invalid BBO is also treated as wide-spread.
# Override without rebuilding with the MAX_SPREAD_ABS environment variable.
MAX_SPREAD_ABS = 0.01

# Stop opening new positions once the UTC day's realized net PnL is at or
# below -MAX_DAILY_LOSS_USD.  0 disables.  Editable on /config.  Scaled for
# the full 12-market configuration; with only the six 5m markets enabled
# you may prefer the older 20U/8U values.
MAX_DAILY_LOSS_USD = 40.0
# Pause new entries when the UTC day's realized PnL falls this far below
# its intraday high-water mark.  The pause lasts INTRADAY_DRAWDOWN_PAUSE_MIN
# minutes (default 60; use 120 for 2 h), then entries resume and the
# drawdown anchor is rebased to the PnL at resume time.  0 disables.
# Editable on /config.
MAX_INTRADAY_DRAWDOWN_USD = 16.0
INTRADAY_DRAWDOWN_PAUSE_MIN = 60.0
# Total exposure per market window across BOTH sides and all markets on
# that timeframe.  The 5m and 15m windows are counted separately.  Open
# positions plus in-flight entries from earlier windows count only when
# they belong to the same window.  0 disables each cap.  Editable on /config.
MAX_POSITIONS_PER_WINDOW = 3
MAX_WINDOW_NOTIONAL_USD = 6.0
# Per-coin rolling performance de-risking, computed from trades.jsonl.
# At or below ASSET_PERF_MIN_PNL_USD the entry stake is multiplied by
# ASSET_PERF_STAKE_MULT; at or below ASSET_PERF_DISABLE_PNL_USD new
# entries for that coin are skipped on both timeframes.  LOOKBACK_DAYS = 0
# disables the rule.  Editable on /config.
ASSET_PERF_LOOKBACK_DAYS = 7.0
ASSET_PERF_MIN_PNL_USD = -3.0
ASSET_PERF_STAKE_MULT = 0.5
ASSET_PERF_DISABLE_PNL_USD = -6.0
# A file whose presence pauses NEW entries (exits still run).
KILL_SWITCH_FILE = "data/STOP"
PAUSE_NEW_ENTRIES = false
# Sell open positions on a graceful shutdown (best effort).
FLATTEN_ON_EXIT = false

# If true, skip asset/side configs whose TP target does not cover the
# round-trip taker fee.  Off by default so the doc parameters run as written;
# the startup fee report always warns about them.
SKIP_FEE_NEGATIVE = false

[WEB]
# In-process FastAPI backend: dashboard + JSON API on port 8033.
ENABLED = true
HOST = "0.0.0.0"
PORT = 8033
# Set WEB_PASSWORD in .env to enable HTTP Basic auth.  Empty = open access.
USERNAME = "admin"
PASSWORD = ""
# Login session lifetime (seconds).  In-memory: a restart forces re-login.
SESSION_TTL_S = 604800
LOG_LEVEL = "warning"
# Comma-separated origins, or "*" for any frontend origin.
CORS_ORIGINS = "*"

[STORAGE]
DATA_DIR = "data"

[LOG]
LEVEL = "INFO"

# ---------------------------------------------------------------------------
# Per-coin defaults for BOTH timeframes
#
# SIDES: "UP", "DOWN" or "BOTH" (two independent positions per window).
# ENTRY_THRESH: first-touch threshold inside the entry window
#               (0-60 s for 5m, 0-180 s for 15m).
# TP_PCT: take-profit fraction above the actual fill price.
# STOP_LOSS_PCT: price-stop fraction below the fill (0 = off); per coin.
#
# Per-market overrides are optional.  Add a sub-table to change only that
# timeframe, e.g.:
#   [ASSETS.ETH.15M]
#   ENTRY_THRESH = 0.20
#   TP_PCT = 0.20
#   STOP_LOSS_PCT = 0.25
# The web /config page edits the same per-market values and persists them
# in data/runtime_config.json.  ENABLED=false on a sub-table disables just
# that timeframe; ENABLED=false on the coin disables both.
#
# Enabled set: the six non-BTC coins run 5m only.  15m is off by default
# (backtest not good enough) and can be enabled per market on /config or
# with [ASSETS.X.15M] ENABLED=true.  BTC is off on both timeframes: its 5%
# taker fee is still too expensive for the 0.25/10% TP over the 6-month
# recheck, so it stays disabled until the fee or the parameters improve.
# ---------------------------------------------------------------------------

[ASSETS.BTC]
ENABLED = false  # BTC 费率 5%，6 个月复测费后仍亏损，5m/15m 均默认关闭
SIDES = "BOTH"
ENTRY_THRESH = 0.25
TP_PCT = 0.10
# Official BTC taker fee is 5% (other crypto markets are 1%).
TAKER_FEE_RATE = 0.05

[ASSETS.ETH]
ENABLED = true
# Coin-level values are the current 15m defaults.
SIDES = "BOTH"
ENTRY_THRESH = 0.18
TP_PCT = 0.15

# Latest 5m backtest: minimum-drawdown tier (entry 0.06 / TP 15% / SL 10%).
[ASSETS.ETH.5M]
ENTRY_THRESH = 0.06
TP_PCT = 0.15
STOP_LOSS_PCT = 0.10

[ASSETS.BNB]
ENABLED = true
# Coin-level values are the current 15m defaults.
SIDES = "BOTH"
ENTRY_THRESH = 0.15
TP_PCT = 0.10

# Latest 5m backtest: minimum-drawdown tier (entry 0.06 / TP 15% / SL 10%).
[ASSETS.BNB.5M]
ENTRY_THRESH = 0.06
TP_PCT = 0.15
STOP_LOSS_PCT = 0.10

[ASSETS.SOL]
ENABLED = true
# Coin-level values are the current 15m defaults.
SIDES = "BOTH"
ENTRY_THRESH = 0.15
TP_PCT = 0.20

# Latest 5m backtest: minimum-drawdown tier (entry 0.08 / TP 10% / SL 0).
[ASSETS.SOL.5M]
ENTRY_THRESH = 0.08
TP_PCT = 0.10
STOP_LOSS_PCT = 0.0

[ASSETS.DOGE]
ENABLED = true
# Coin-level values are the current 15m defaults.
SIDES = "BOTH"
ENTRY_THRESH = 0.12
TP_PCT = 0.25

# Latest 5m backtest: minimum-drawdown tier (entry 0.06 / TP 15% / SL 10%).
[ASSETS.DOGE.5M]
ENTRY_THRESH = 0.06
TP_PCT = 0.15
STOP_LOSS_PCT = 0.10

[ASSETS.XRP]
ENABLED = true
# Coin-level values are the current 15m defaults.  Doc §4.3 found an UP
# advantage; the operator default here is BOTH.
SIDES = "BOTH"
ENTRY_THRESH = 0.10
TP_PCT = 0.25

# Latest 5m backtest: minimum-drawdown tier (entry 0.06 / TP 15% / SL 10%).
[ASSETS.XRP.5M]
ENTRY_THRESH = 0.06
TP_PCT = 0.15
STOP_LOSS_PCT = 0.10

[ASSETS.HYPE]
ENABLED = true
# Coin-level values are the current 15m defaults.  Operator override for
# 15m: 0.14/25% (the doc's 0.30/10% was the original top-1).
SIDES = "BOTH"
ENTRY_THRESH = 0.14
TP_PCT = 0.25

# Latest 5m backtest: minimum-drawdown tier (entry 0.10 / TP 10% / SL 10%).
[ASSETS.HYPE.5M]
ENTRY_THRESH = 0.10
TP_PCT = 0.10
STOP_LOSS_PCT = 0.10
