###############################################################################
# 06.poly5mAll — 7-asset 5m Up/Down rebound strategy (strategy 1)
#
# Parameters reproduce docs/all_5m_strategy1_summary.md §2 "生产推荐".
# Strategy timeline (per 300 s window):
#   0–60 s   observe + first touch of ENTRY_THRESH -> buy
#   60–240 s take profit at entry_price * (1 + TP_PCT)
#   240 s    forced exit at market (the doc's "240s SL single-point")
###############################################################################

[GENERAL]
# 5m markets only.  Changing this without changing the strategy is not
# supported: the 60/240 s boundaries are tied to a 300 s window.
WINDOW_SEC = 300
ENTRY_WINDOW_END_S = 60.0
TP_WINDOW_START_S = 60.0
FORCE_EXIT_S = 240.0
# Retry a failed forced exit until this many seconds after window start.
FORCE_EXIT_DEADLINE_S = 295.0
# Strategy evaluation cadence.  The CLOB WS is event-driven on top of this.
TICK_S = 0.25

[FEED]
# Price layer adapted from ../02.poly1h:
#   * Gamma /events?slug=... for 5m market discovery
#   * CLOB market WebSocket for best bid/ask + last trade
#   * CLOB /midpoint polled every REST_MIDPOINT_POLL_S as the stable fallback
USE_WS = true
# Independent CLOB WS connections (hash-sharded tokens).  1 = old single
# connection; 7 reduces per-connection subscription load.
WS_SHARDS = 7
# REST /book fallback poll for current tokens, so bid/ask remain usable
# when the WS is down.
BOOK_POLL_S = 3.0
REST_MIDPOINT_POLL_S = 2.0
MARKET_DISCOVERY_S = 2.0
# Start looking for the next 5m window this many seconds before it opens.
PRE_DISCOVERY_LEAD_S = 60.0
# A quote older than this cannot open a position.
STALE_PRICE_MAX_AGE_S = 5.0
# Exits are allowed a longer staleness window; refusing to exit is worse
# than exiting on a slightly old quote.
EXIT_STALE_PRICE_MAX_AGE_S = 15.0
REQUEST_TIMEOUT_S = 5.0

[EXECUTION]
# Paper is the safe default.  Live requires PAPER_TRADING=false AND
# LIVE_ENABLED=true, plus credentials in .env.
PAPER_TRADING = true
LIVE_ENABLED = false

# Fixed stake per trade.  The doc's backtest used 10 U; live default is 2 U.
STAKE_USD = 2.0

# Official Polymarket taker fee:
#   fee = shares * rate * p * (1 - p)
# Current crypto 5m schedule: BTC = 0.05, every other asset = 0.01.
# This value is the default for assets without their own TAKER_FEE_RATE
# (see [ASSETS.BTC] below); makers pay 0.  The doc's backtest excludes
# fees; keep INCLUDE_FEES=true for realistic paper PnL, or set it false
# to reproduce the doc's gross numbers.
TAKER_FEE_RATE = 0.01
INCLUDE_FEES = true

# Take-profit execution:
#   observed = trigger on executable bid >= target, FAK sell at target floor;
#              the fill is the best bid (captures a gap above target).
#   market   = trigger on observed mid >= target, marketable FAK below the
#              bid (doc's option B); can fill below target.
TP_EXECUTION_MODE = "observed"

# Price stop-loss is retired (0 = off).  The 240s forced exit remains.
STOP_LOSS_PCT = 0.0

# Entry liquidity gate: require both sides of the book and at least this
# much bid notional (USDC), so the position can be exited later.
REQUIRE_TWO_SIDED_BOOK = true
MIN_ENTRY_BID_DEPTH_USD = 5.0

# Max concurrent open positions with the same side across all assets.
MAX_SAME_SIDE_POSITIONS = 6
# Max same-side entries inside one 5m window, across all assets.  Crypto
# 5m markets are highly correlated: three UP entries in one window are
# effectively one leveraged bet.  Earlier-window positions still awaiting
# settlement do not count.  0 disables the cap.
MAX_SAME_SIDE_PER_WINDOW = 2

# Retry cadence when a FAK order returns no fill.
ENTRY_RETRY_S = 1.0
EXIT_RETRY_S = 1.0
# Forced-exit sell limit as a fraction below the current bid (2% = 2.0).
SLIPPAGE_PCT = 2.0

# Optional microstructure filter: skip an entry when the absolute spread
# (ask - bid) exceeds this price.  0.01 = 1 cent; 0 disables the filter.
# When enabled, a missing/invalid BBO is also treated as wide-spread.
# Override without rebuilding with the MAX_SPREAD_ABS environment variable.
MAX_SPREAD_ABS = 0.01

# Stop opening new positions once the UTC day's realized net PnL is at or
# below -MAX_DAILY_LOSS_USD.  0 disables.  Editable on /config.
MAX_DAILY_LOSS_USD = 20.0
# A file whose presence pauses NEW entries (exits still run).
KILL_SWITCH_FILE = "data/STOP"
PAUSE_NEW_ENTRIES = false
# Sell open positions on a graceful shutdown (best effort).
FLATTEN_ON_EXIT = false

# If true, skip asset/side configs whose TP target does not cover the
# round-trip taker fee.  Off by default so the doc parameters run as written;
# the startup fee report always warns about them.
SKIP_FEE_NEGATIVE = false

[WEB]
# In-process FastAPI backend: dashboard + JSON API on port 8033.
ENABLED = true
HOST = "0.0.0.0"
PORT = 8033
# Set WEB_PASSWORD in .env to enable HTTP Basic auth.  Empty = open access.
USERNAME = "admin"
PASSWORD = ""
# Login session lifetime (seconds).  In-memory: a restart forces re-login.
SESSION_TTL_S = 604800
LOG_LEVEL = "warning"
# Comma-separated origins, or "*" for any frontend origin.
CORS_ORIGINS = "*"

[STORAGE]
DATA_DIR = "data"

[LOG]
LEVEL = "INFO"

# ---------------------------------------------------------------------------
# Per-asset forced-exit timing is optional.  The [GENERAL] values above are
# the defaults; add FORCE_EXIT_S / FORCE_EXIT_DEADLINE_S to any [ASSETS.X]
# table to override them per coin (the web /config page writes the same
# fields).  If only FORCE_EXIT_S is set, the deadline defaults to
# min(global deadline, FORCE_EXIT_S + 15s).  Example:
#   [ASSETS.ETH]
#   FORCE_EXIT_S = 120
#   FORCE_EXIT_DEADLINE_S = 135
#
# ---------------------------------------------------------------------------
# Per-asset production parameters (docs/all_5m_strategy1_summary.md §2)
#
# SIDES: "UP", "DOWN" or "BOTH" (two independent positions per window).
# ENTRY_THRESH: first-touch threshold in the 0–60 s window.
# TP_PCT: take-profit fraction above the actual fill price.
#
# The doc's direction study recommended DOWN (UP for XRP), but the operator
# default in this project is BOTH for every asset.  Change per coin in
# /config if you want one-sided trading.
#
# Enabled set: the six non-BTC assets are on; BTC is off.  BTC's 5% taker
# fee is still too expensive for the 0.25/10% TP over the 6-month recheck,
# so it stays disabled until the fee or the parameters improve.
# ---------------------------------------------------------------------------

[ASSETS.BTC]
ENABLED = false  # BTC 5m 费率 5%，6 个月复测费后仍亏损，默认关闭
SIDES = "BOTH"
ENTRY_THRESH = 0.25
TP_PCT = 0.10
# Official BTC 5m taker fee is 5% (other crypto 5m markets are 1%).
TAKER_FEE_RATE = 0.05
# Backtest: BTC 0.25/10% benefits from a 20% stop.

[ASSETS.ETH]
ENABLED = true
# ETH comes from the older both-sides report; 0.18 is the reported sweet spot.
SIDES = "BOTH"
ENTRY_THRESH = 0.18
TP_PCT = 0.15
# Low entry: the 20% stop tested worse; keep it off.

[ASSETS.BNB]
ENABLED = true
SIDES = "BOTH"
ENTRY_THRESH = 0.15
TP_PCT = 0.10

[ASSETS.SOL]
ENABLED = true
SIDES = "BOTH"
ENTRY_THRESH = 0.15
TP_PCT = 0.20

[ASSETS.DOGE]
ENABLED = true
SIDES = "BOTH"
ENTRY_THRESH = 0.12
TP_PCT = 0.25

[ASSETS.XRP]
ENABLED = true
# Doc §4.3 found an UP advantage; the operator default here is BOTH.
SIDES = "BOTH"
ENTRY_THRESH = 0.10
TP_PCT = 0.25

[ASSETS.HYPE]
ENABLED = true
# Operator override: 0.14/25% (the doc's 0.30/10% was the original top-1).
SIDES = "BOTH"
ENTRY_THRESH = 0.14
TP_PCT = 0.25
