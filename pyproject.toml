[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "poly5m-all"
version = "0.1.0"
description = "Polymarket 7-asset 5m Up/Down rebound strategy (strategy 1)"
requires-python = ">=3.11"
dependencies = [
    "websockets>=12",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "loguru>=0.7",
    "py-clob-client-v2>=1.0,<2",
    "eth-account>=0.13",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
